name: tests

# Red de seguridad A2: ejecuta la suite y la compara contra la linea base V1.
# "CI" = integracion continua: GitHub ejecuta esto automaticamente en cada push/PR.
# No usa secretos ni variables de Databento/AWS: la suite corre sin red externa requerida.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    # Contenedor con el MISMO Python que produccion (3.11.16). La etiqueta
    # python:3.11.16-slim fue verificada con `docker manifest inspect` antes de fijarla.
    container: python:3.11.16-slim

    steps:
      # 1. Trae el codigo del repositorio al runner.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instala exactamente las dependencias congeladas de produccion (pin por version).
      - name: Install pinned dependencies
        run: pip install -r requirements-ci.txt

      # 3. Verifica que no haya conflictos de dependencias entre los paquetes instalados.
      - name: pip check
        run: python -m pip check

      # 4. Ejecuta la suite y escribe el reporte JUnit. continue-on-error: los fallos
      #    conocidos de la linea base NO deben cortar aqui; el paso 5 decide el resultado.
      - name: Run pytest
        continue-on-error: true
        run: python -m pytest -p no:cacheprovider --junitxml=junit.xml

      # 5. Compara el resultado contra la linea base V1. ESTE paso decide PASS/FAIL:
      #    falla solo si hay NEW_FAIL (regresion) o MISSING (test que desaparecio).
      - name: Verify against V1 baseline
        run: python scripts/check_test_baseline.py --verify junit.xml --baseline tests/baseline/v1_baseline.json

      # 6. Publica el JUnit como artifact para inspeccion posterior. always(): tambien si fallo.
      - name: Upload junit.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
