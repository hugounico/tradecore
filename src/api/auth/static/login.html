<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tc-supabase-url" content="__TC_SUPABASE_URL__">
<meta name="tc-publishable-key" content="__TC_PUBLISHABLE_KEY__">
<title>TradeCore · Acceso</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1115; color: #e6e8eb; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 360px; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9aa3ad; font-size: 13px; }
  section { background: #171a21; border: 1px solid #262b35; border-radius: 10px; padding: 20px; }
  label { display: block; font-size: 13px; color: #b8c0c9; margin: 12px 0 4px; }
  input { width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid #333a46; background: #0f1115; color: inherit; font: inherit; }
  button, a.btn { display: block; width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 6px;
                  background: #2f6fed; color: #fff; font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
  button.secondary { background: #2a2f3a; }
  button:disabled { opacity: .55; cursor: default; }
  .link { display: inline-block; margin-top: 14px; color: #8fb1ff; font-size: 13px; background: none; border: 0; padding: 0; width: auto; cursor: pointer; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; }
  .msg.err { color: #ff8a80; }
  .msg.ok { color: #7ee2a8; }
  [hidden] { display: none !important; }
  body[data-view="login"] #view-session { display: none; }
  body[data-view="session"] #view-login, body[data-view="session"] #view-password { display: none; }
</style>
</head>
<body data-view="__TC_VIEW__">
<main>
  <h1>TradeCore</h1>
  <p class="sub">Acceso restringido</p>

  <section id="view-login">
    <form id="form-login" novalidate>
      <label for="login-email">Correo</label>
      <input id="login-email" type="email" autocomplete="username" required>
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button id="login-submit" type="submit">Ingresar</button>
      <div id="login-msg" class="msg" role="status" aria-live="polite"></div>
    </form>
    <button id="show-password" class="link" type="button">Cambiar contraseña</button>
  </section>

  <section id="view-password" hidden>
    <form id="form-password" novalidate>
      <label for="pw-email">Correo</label>
      <input id="pw-email" type="email" autocomplete="username" required>
      <label for="pw-current">Contraseña actual</label>
      <input id="pw-current" type="password" autocomplete="current-password" required>
      <label for="pw-new">Nueva contraseña (mínimo 12 caracteres)</label>
      <input id="pw-new" type="password" autocomplete="new-password" minlength="12" required>
      <label for="pw-confirm">Confirmar nueva contraseña</label>
      <input id="pw-confirm" type="password" autocomplete="new-password" minlength="12" required>
      <button id="pw-submit" type="submit">Cambiar contraseña</button>
      <div id="pw-msg" class="msg" role="status" aria-live="polite"></div>
    </form>
    <button id="show-login" class="link" type="button">Volver al ingreso</button>
  </section>

  <section id="view-session">
    <p>Sesión activa.</p>
    <a id="go-dashboard" class="btn" href="/static/index.html">Ir al dashboard</a>
    <form method="post" action="/auth/logout">
      <button id="logout-submit" class="secondary" type="submit">Cerrar sesión</button>
    </form>
  </section>
</main>
<script src="/auth/login.js" defer></script>
</body>
</html>
